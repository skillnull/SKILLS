name: Skill quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Private content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan files and complete history
        env:
          PRIVATE_CONTENT_TERMS_JSON: ${{ secrets.PRIVATE_CONTENT_TERMS_JSON }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_private_content.py --history --require-private-terms

  quality:
    name: Skill quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate repository contracts
        run: python3 scripts/validate_project.py
      - name: Validate Agent Skills specification
        run: |
          mkdir -p "$RUNNER_TEMP/package/skillnull"
          cp SKILL.md "$RUNNER_TEMP/package/skillnull/SKILL.md"
          "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$RUNNER_TEMP/package/skillnull"
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
